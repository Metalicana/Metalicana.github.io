<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">CREST — event-centric frame selection</title>
  <desc id="desc">A conceptual relevance curve over a video timeline. Highlighted frames cluster around salient events, using a fixed frame budget.</desc>
  <rect width="640" height="400" fill="#f0f3f9"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="52" font-size="30" font-weight="700" fill="#2d405f">CREST</text>
    <text x="36" y="81" font-size="17" fill="#65738c">Find the moments that matter.</text>
    <rect x="36" y="109" width="568" height="169" rx="12" fill="#fff"/>
    <g stroke="#e6eaf2" stroke-width="2"><path d="M62 148h516M62 198h516M62 247h516"/></g>
    <path d="M62 248 C92 248 103 235 124 231 S151 142 177 143 S207 243 239 246 S278 234 300 228 S331 131 359 131 S391 212 419 219 S451 166 473 164 S506 247 540 242 L578 239" fill="none" stroke="#6b83b1" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#bdcce3" stroke-width="2" stroke-dasharray="5 5"><path d="M164 164v147M189 163v148M346 149v162M371 148v163M472 164v147"/></g>
    <g fill="#fff" stroke="#496eac" stroke-width="4"><circle cx="177" cy="143" r="7"/><circle cx="359" cy="131" r="7"/><circle cx="473" cy="164" r="7"/></g>
    <g fill="#d4ddeb"><rect x="40" y="299" width="42" height="43" rx="5"/><rect x="94" y="299" width="42" height="43" rx="5"/><rect x="148" y="299" width="42" height="43" rx="5"/><rect x="202" y="299" width="42" height="43" rx="5"/><rect x="256" y="299" width="42" height="43" rx="5"/><rect x="310" y="299" width="42" height="43" rx="5"/><rect x="364" y="299" width="42" height="43" rx="5"/><rect x="418" y="299" width="42" height="43" rx="5"/><rect x="472" y="299" width="42" height="43" rx="5"/><rect x="526" y="299" width="42" height="43" rx="5"/></g>
    <g fill="#496eac"><rect x="148" y="299" width="42" height="43" rx="5"/><rect x="202" y="299" width="42" height="43" rx="5"/><rect x="310" y="299" width="42" height="43" rx="5"/><rect x="364" y="299" width="42" height="43" rx="5"/><rect x="472" y="299" width="42" height="43" rx="5"/></g>
    <text x="40" y="374" font-size="16" fill="#65738c">Video timeline</text><rect x="400" y="360" width="15" height="15" rx="3" fill="#496eac"/><text x="426" y="374" font-size="16" fill="#496eac">Selected frames</text>
