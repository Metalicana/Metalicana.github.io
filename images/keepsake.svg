<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Keepsake — selective spatial memory</title>
  <desc id="desc">A conceptual pose-appearance graph with redundant observations in gray and complementary views retained in a bounded memory bank in teal.</desc>
  <rect width="640" height="400" fill="#eef5f4"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="52" font-size="30" font-weight="700" fill="#203c40">Keepsake</text>
    <text x="36" y="81" font-size="17" fill="#5b7578">Remember the views that matter.</text>
    <rect x="36" y="112" width="568" height="179" rx="12" fill="#fff"/>
    <g fill="none" stroke="#d4dfe1" stroke-width="3">
      <path d="M94 179 150 142 188 209 94 179 132 249 188 209 150 142M188 209 302 165 348 231 188 209M302 165 369 141 411 192 348 231 369 141M411 192 499 150 544 226 488 252 411 192M499 150 488 252"/>
    </g>
    <g fill="#dae3e5" stroke="#fff" stroke-width="3">
      <circle cx="94" cy="179" r="13"/><circle cx="150" cy="142" r="13"/><circle cx="132" cy="249" r="13"/>
      <circle cx="302" cy="165" r="13"/><circle cx="369" cy="141" r="13"/><circle cx="411" cy="192" r="13"/>
      <circle cx="499" cy="150" r="13"/><circle cx="488" cy="252" r="13"/>
    </g>
    <path d="M188 209 348 231 544 226" stroke="#6eaaa5" stroke-width="3" stroke-dasharray="6 7" fill="none"/>
    <g fill="#247a74" stroke="#e0efec" stroke-width="6"><circle cx="188" cy="209" r="20"/><circle cx="348" cy="231" r="20"/><circle cx="544" cy="226" r="20"/></g>
    <g fill="#fff" font-size="16" text-anchor="middle" font-weight="700"><text x="188" y="215">1</text><text x="348" y="237">2</text><text x="544" y="232">3</text></g>
    <text x="36" y="339" font-size="17" fill="#365e61">Fixed-capacity memory</text>
    <g fill="#247a74"><rect x="294" y="311" width="86" height="49" rx="7"/><rect x="392" y="311" width="86" height="49" rx="7"/><rect x="490" y="311" width="86" height="49" rx="7"/></g>
    <g fill="#fff" font-size="17" text-anchor="middle"><text x="337" y="342">View 1</text><text x="435" y="342">View 2</text><text x="533" y="342">View 3</text></g>
  </g>
</svg>
